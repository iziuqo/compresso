plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.compressoengine'
version = '0.1.0'

android {
  namespace "expo.modules.compressoengine"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation "androidx.exifinterface:exifinterface:1.3.7"
}
