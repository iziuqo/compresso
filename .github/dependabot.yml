version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Tools released together move together, majors included, so one PR updates
    # the whole family and its tests run against matching versions.
    groups:
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/*'
      size-limit:
        patterns:
          - 'size-limit'
          - '@size-limit/*'
      npm-dependencies:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
  # Actions are pinned to a commit; this keeps the pins and their version comments current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - '*'
