name: Shorts photos

# Wikimedia Commons answers 429 to the shared addresses cloud sessions use,
# so the Shorts' candidates and originals are fetched here and committed for
# the session to pull: previews for each search in shorts/candidates.json,
# and the photos.json originals named in shorts/fetch.txt, checked against
# Commons' SHA-1. The session then untracks them and drops this workflow:
# squash-merge, so they never reach main.
on:
  push:
    branches-ignore: [main]
    paths:
      - 'shorts/candidates.json'
      - 'shorts/fetch.txt'
      - '.github/workflows/shorts-photos.yml'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node shorts/scripts/candidates.mjs
        if: hashFiles('shorts/candidates.json') != ''
      - run: node shorts/scripts/photos.mjs $(cat shorts/fetch.txt)
        if: hashFiles('shorts/fetch.txt') != ''
      - name: Commit what was fetched
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          for d in shorts/public/candidates shorts/public/photos; do [ -d "$d" ] && git add -f "$d"; done
          git diff --cached --quiet && exit 0
          git -c user.name='github-actions[bot]' -c user.email='41898299+github-actions[bot]@users.noreply.github.com' \
            commit -m 'Fetch Shorts photos from Wikimedia Commons'
          git push origin "HEAD:$BRANCH"
