name: Shorts photos

# Wikimedia Commons answers 429 to the shared addresses cloud sessions use,
# so the Shorts' originals are fetched here, checked against Commons' SHA-1
# by shorts/scripts/photos.mjs, and committed for the session to pull. The
# session then untracks them: squash-merge, so they never reach main.
on:
  push:
    branches-ignore: [main]
    paths:
      - 'shorts/photos.json'
      - '.github/workflows/shorts-photos.yml'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node shorts/scripts/photos.mjs
      - name: Commit the originals
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git add -f shorts/public/photos
          git diff --cached --quiet && exit 0
          git -c user.name='github-actions[bot]' -c user.email='41898299+github-actions[bot]@users.noreply.github.com' \
            commit -m 'Fetch the Shorts photos from Wikimedia Commons'
          git push origin "HEAD:$BRANCH"
