name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Node 18 dropped here too (see the test matrix below for the first
        # instance of this): @rollup/plugin-terser 1.0.0 and its
        # serialize-javascript@7 dependency both declare engines.node
        # ">=20.0.0" — not a bug to polyfill around, an explicit floor. It
        # fails on 18 with "ReferenceError: crypto is not defined"
        # (serialize-javascript's generateUID assumes Node 20's stable global
        # WebCrypto). Same class of issue as rolldown below: the build
        # *tooling's* floor, not a constraint on compresso's own shipped code.
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - run: npm ci
      - run: npm run build:lib

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Node 18 excluded here for the same reason the build matrix above
        # now excludes it too: vitest 4.1.10 pulls in rolldown, which
        # declares engines.node: "^20.19.0 || >=22.12.0" and fails at startup
        # on 18 with "SyntaxError: The requested module 'node:util' does not
        # provide an export named 'styleText'". That's the test *tooling's*
        # floor, not a constraint compresso's own published code has — no CI
        # job runs on Node 18 anymore, but nothing compresso.js ships
        # actually requires Node 20+ itself; only the dev tooling does.
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - run: npm ci
      - run: npm run test:lib

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci
      - run: npm run test:types

  test-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: packages/compresso
      - run: npm run test:lib:browser
      # Unit + Chromium coverage must stay at or above the thresholds in
      # packages/compresso/vitest.config.js.
      - run: npm run test:lib:coverage

  # The browser suite again, against the built files npm users get.
  test-dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: packages/compresso
      - run: npm run build:lib
      - run: npm run test:lib:dist

  # The device lab page (packages/compresso/lab/) in Chromium, Firefox and WebKit.
  test-lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: packages/compresso
      - run: npm run build:lib
      - run: npm run test:lib:lab

  # The packed tarball: publint, attw, and seven bundler apps in Chromium.
  test-bundlers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            packages/compresso/test/bundlers/package-lock.json
      - run: npm ci
      - run: npm ci --prefix packages/compresso/test/bundlers
      - run: npx playwright install --with-deps chromium
        working-directory: packages/compresso
      - run: npm run build:lib
      - run: npm run test:lib:bundlers
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: npm-tarball
          path: packages/compresso/test/bundlers/.out/*.tgz
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci
      - run: npm run build:lib
      - run: npm run size:lib

  # TEMPORARY: a job left out of ci-ok's needs, to show ci-ok names it.
  left-out:
    runs-on: ubuntu-latest
    steps:
      - run: echo left out

  # The one check the "Protect main" ruleset requires. It passes only when
  # every other job in this file passed, so adding, renaming or splitting a
  # job (a new Node version, say) needs no ruleset change. Its first step
  # fails if a job here is missing from `needs`.
  ci-ok:
    if: always()
    needs: [build, test, types, test-browser, test-dist, test-lab, test-bundlers, size]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/workflows/ci.yml
          sparse-checkout-cone-mode: false
      - name: ci-ok waits for every job
        run: |
          missing=$(yq -o=json '.' .github/workflows/ci.yml | jq -r '(.jobs | keys) - ["ci-ok"] - .jobs["ci-ok"].needs | join(", ")')
          if [ -n "$missing" ]; then
            echo "::error::ci-ok does not wait for: $missing"
            exit 1
          fi
      - name: Every job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          jq -e 'all(.[]; .result == "success")' <<< "$NEEDS" > /dev/null
