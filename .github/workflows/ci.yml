name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only by default: no job here writes to the repository.
permissions:
  contents: read

# A new push to a pull request cancels its superseded run; runs on main always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The Node releases still in support: 22 and 24 (LTS) and 26 (current).
        # The floor is the dev tooling's, not the library's: rolldown (via
        # vitest) needs ^20.19.0 || >=22.12.0, and nothing compresso.js ships
        # needs Node at all. A new version here needs no ruleset change, since
        # the ruleset requires only ci-ok.
        node-version: [22, 24, 26]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - run: npm ci
      - run: npm run build:lib

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The same Node versions as the build matrix above.
        node-version: [22, 24, 26]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - run: npm ci
      - run: npm run test:lib

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci
      - run: npm run test:types

  test-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: packages/compresso
      - run: npm run test:lib:browser
      # Unit + Chromium coverage must stay at or above the thresholds in
      # packages/compresso/vitest.config.js.
      - run: npm run test:lib:coverage

  # The browser suite again, against the built files npm users get.
  test-dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: packages/compresso
      - run: npm run build:lib
      - run: npm run test:lib:dist

  # The device lab page (packages/compresso/lab/) in Chromium, Firefox and WebKit.
  test-lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: packages/compresso
      - run: npm run build:lib
      - run: npm run test:lib:lab

  # The packed tarball: publint, attw, and seven bundler apps in Chromium.
  test-bundlers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            packages/compresso/test/bundlers/package-lock.json
      - run: npm ci
      - run: npm ci --prefix packages/compresso/test/bundlers
      - run: npx playwright install --with-deps chromium
        working-directory: packages/compresso
      - run: npm run build:lib
      - run: npm run test:lib:bundlers
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: npm-tarball
          path: packages/compresso/test/bundlers/.out/*.tgz
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci
      - run: npm run build:lib
      - run: npm run size:lib

  # The one check the "Protect main" ruleset requires. It passes only when
  # every other job in this file passed, so adding, renaming or splitting a
  # job (a new Node version, say) needs no ruleset change. Its first step
  # fails if a job here is missing from `needs`.
  ci-ok:
    if: always()
    needs: [build, test, types, test-browser, test-dist, test-lab, test-bundlers, size]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/workflows/ci.yml
          sparse-checkout-cone-mode: false
      - name: ci-ok waits for every job
        run: |
          set -o pipefail
          missing=$(yq -o=json '.' .github/workflows/ci.yml | jq -r '(.jobs | keys) - ["ci-ok"] - .jobs["ci-ok"].needs | join(", ")')
          if [ -n "$missing" ]; then
            echo "::error::ci-ok does not wait for: $missing"
            exit 1
          fi
      - name: Every job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          jq -e 'all(.[]; .result == "success")' <<< "$NEEDS" > /dev/null
